name: Versão

# Release só sai quando alguém cria uma tag vX.Y.Z (a Máxima, no fim de um milestone). Disparo à mão (ensaio) gera o
# instalador e o sobe como artefato, sem criar tag nem release. Não assina o instalador (decisão D9, do Eliel).
# Permissão de escrita (contents: write) só no job `release`, que nunca roda no ensaio.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Conferir que a tag bate com a versão do app
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSAO=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSAO}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão ${VERSAO} em apps/desktop/package.json." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build -w apps/desktop
      - name: Gerar o instalador (NSIS)
        run: npx electron-builder --config electron-builder.json --win --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # sem assinatura de código
      - name: Checksums e teto de tamanho
        if: github.event_name == 'push'
        run: node apps/desktop/scripts/checksums.mjs apps/desktop/release
      - name: Subir o instalador do ensaio como artefato
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador-ensaio
          path: apps/desktop/release/SabreHosting-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Subir o instalador e os checksums para a release
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instalador-release
          path: |
            apps/desktop/release/SabreHosting-Setup-*.exe
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: instalador
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # só este job cria a release
    steps:
      - name: Baixar o instalador e os checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: instalador-release
          path: release
      - name: Publicar a release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/SabreHosting-Setup-*.exe \
            release/SHA256SUMS.txt \
            --title "SabreHosting ${GITHUB_REF_NAME}" \
            --notes "Instalador para Windows. Confira o SHA-256 em SHA256SUMS.txt antes de instalar."
